<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto Graciela — Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161513;
    --ink-2:#262420;
    --gold:#bf9b46;
    --gold-deep:#9c7c2e;
    --cream:#f1e6cd;
    --paper:#ffffff;
    --bg:#f4f2ec;
    --line:#e6e1d6;
    --text:#1d1c1a;
    --muted:#7a756c;
    --green:#2f7d4f;
    --green-bg:#e7f3eb;
    --amber:#9a7a16;
    --amber-bg:#f7eecd;
    --red:#a23a2e;
    --red-bg:#f6e6e3;
    --shadow:0 1px 2px rgba(20,18,15,.05),0 8px 24px rgba(20,18,15,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:660px;margin:0 auto;padding:0 16px 64px;}
  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink);
    margin:0 -16px 20px;
    padding:18px 16px 16px;
    border-bottom:3px solid var(--gold);
    position:sticky;top:0;z-index:20;
  }
  .topbar-inner{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .mono{
    width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    color:var(--gold);font-family:'Montserrat';font-weight:800;font-size:15px;letter-spacing:.5px;
  }
  .brand h1{
    margin:0;color:#fff;font-family:'Montserrat';font-weight:800;
    font-size:16px;letter-spacing:2.5px;line-height:1.1;
  }
  .brand p{margin:1px 0 0;color:#b9b09c;font-size:10px;letter-spacing:2px;text-transform:uppercase;}
  .topbar .back{
    margin-left:auto;background:transparent;border:1px solid #4a463d;color:#e9e3d3;
    padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;
  }
  .topbar .back:hover{border-color:var(--gold);color:#fff}
  /* ---------- Typography helpers ---------- */
  .eyebrow{font-family:'Montserrat';font-weight:700;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-deep);}
  h2.page{font-family:'Montserrat';font-weight:800;font-size:24px;letter-spacing:-.3px;margin:6px 0 2px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Montserrat';font-weight:600;font-size:14px;letter-spacing:.3px;
    padding:13px 18px;border-radius:11px;border:1px solid transparent;cursor:pointer;
    text-decoration:none;transition:transform .04s ease, background .15s ease, border-color .15s ease;
    width:100%;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000}
  .btn-gold{background:var(--gold);color:#23200e;}
  .btn-gold:hover{background:var(--gold-deep);color:#fff}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--gold)}
  .btn-danger{background:#fff;color:var(--red);border-color:var(--red-bg);}
  .btn-danger:hover{background:var(--red-bg)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row .btn{width:auto;flex:1 1 auto;min-width:140px}
  .btn-sm{padding:9px 13px;font-size:13px;border-radius:9px;width:auto}
  /* ---------- Cards ---------- */
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:20px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  .card.tight{padding:16px}
  .choice{
    display:flex;gap:14px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;
    background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;
    box-shadow:var(--shadow);transition:border-color .15s ease, transform .04s ease;font-family:inherit;
  }
  .choice:hover{border-color:var(--gold)}
  .choice:active{transform:translateY(1px)}
  .choice .ic{
    width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--cream);color:var(--gold-deep);
  }
  .choice .ic svg{width:22px;height:22px}
  .choice h3{margin:2px 0 3px;font-family:'Montserrat';font-weight:700;font-size:16px;}
  .choice p{margin:0;color:var(--muted);font-size:13.5px;}
  /* ---------- Forms ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:#3a382f}
  .field .hint{font-weight:400;color:var(--muted);font-size:12px}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:15px;background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(191,155,70,.15)}
  textarea{resize:vertical;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:480px){.grid2{grid-template-columns:1fr}}
  .pininput{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700;font-family:'Montserrat'}
  /* ---------- Package selector ---------- */
  .pkg{
    position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;
    padding:16px 16px 16px 20px;margin-bottom:12px;cursor:pointer;overflow:hidden;transition:border-color .15s ease;
  }
  .pkg:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold);opacity:.5}
  .pkg:hover{border-color:var(--gold)}
  .pkg.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
  .pkg.sel:before{opacity:1}
  .pkg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .pkg-head .name{font-family:'Montserrat';font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
  .pkg-badge{
    margin-left:auto;background:var(--cream);color:#5c4a14;border:1px solid #e2d2a8;
    font-family:'Montserrat';font-weight:700;font-size:13px;padding:4px 12px;border-radius:20px;white-space:nowrap;
  }
  .pkg ul{margin:0;padding-left:18px}
  .pkg li{font-size:12.5px;color:#54514a;margin:3px 0;line-height:1.4}
  .pkg .check{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
  .pkg.sel .check{border-color:var(--ink);background:var(--ink);position:relative}
  .pkg.sel .check:after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  /* ---------- Tags / badges ---------- */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;font-family:'Montserrat';letter-spacing:.3px}
  .tag.green{background:var(--green-bg);color:var(--green)}
  .tag.amber{background:var(--amber-bg);color:var(--amber)}
  .tag.red{background:var(--red-bg);color:var(--red)}
  .tag.gray{background:#eceae3;color:#6c6760}
  .tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  /* ---------- List rows ---------- */
  .row{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;
    box-shadow:var(--shadow);transition:border-color .15s ease, transform .04s ease;
  }
  .row:hover{border-color:var(--gold)}
  .row:active{transform:translateY(1px)}
  .row .avatar{width:42px;height:42px;border-radius:11px;background:var(--ink);color:var(--gold);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-family:'Montserrat';font-weight:700;font-size:15px}
  .row .meta{flex:1;min-width:0}
  .row .meta .name{font-weight:700;font-size:15px;font-family:'Montserrat';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta .line{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .chev{color:#cfcabd;flex:0 0 auto}
  /* ---------- Share box / code ---------- */
  .codebox{
    background:var(--ink);border-radius:16px;padding:22px;text-align:center;color:#fff;margin-bottom:14px;
    border:1px solid #000;
  }
  .codebox .lbl{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#b9b09c;font-family:'Montserrat';font-weight:600}
  .codebox .code{font-family:'Montserrat';font-weight:800;font-size:34px;letter-spacing:4px;color:var(--gold);margin:8px 0 4px}
  .copybtn{background:var(--gold);color:#23200e;border:none;border-radius:9px;padding:8px 16px;font-family:'Montserrat';font-weight:600;font-size:13px;cursor:pointer;margin-top:8px}
  .copybtn:hover{background:#fff}
  /* ---------- Balance meter ---------- */
  .balance{background:#faf8f2;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .balance .nums{display:flex;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .balance .nums .b{flex:1;min-width:90px}
  .balance .nums .b small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}
  .balance .nums .b span{font-family:'Montserrat';font-weight:700;font-size:18px}
  .meter{height:9px;background:#e7e2d6;border-radius:6px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s ease}
  .meter i.full{background:var(--green)}
  /* ---------- Misc ---------- */
  .kv{display:flex;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex:0 0 42%}
  .kv .v{font-weight:500;flex:1}
  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty svg{width:46px;height:46px;color:#d8d2c4;margin-bottom:10px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .sectionline{display:flex;align-items:center;gap:12px;margin:24px 0 14px}
  .sectionline span{font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .sectionline:before,.sectionline:after{content:"";height:1px;background:var(--line);flex:1}
  .anticipo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#faf8f2;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13.5px}
  .anticipo-item .am{font-family:'Montserrat';font-weight:700}
  .anticipo-item .dt{color:var(--muted);margin-left:auto;font-size:12.5px}
  .anticipo-item .del{background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
  .note{background:var(--amber-bg);border:1px solid #ecd99a;color:#6b5410;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
  .note strong{font-weight:700}
  .radio-pills{display:flex;gap:10px}
  .radio-pills label{flex:1;cursor:pointer}
  .radio-pills input{position:absolute;opacity:0;pointer-events:none}
  .radio-pills .pill{display:block;text-align:center;padding:13px;border:1px solid var(--line);border-radius:12px;font-family:'Montserrat';font-weight:600;font-size:14px;background:#fff;transition:all .15s}
  .radio-pills input:checked + .pill{background:var(--ink);color:#fff;border-color:var(--ink)}
  .thanks{text-align:center;padding:10px 0 6px}
  .thanks .big{width:64px;height:64px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .thanks .big svg{width:32px;height:32px}

  /* ============ PRINT SHEET ============ */
  .print-wrap{display:none}
  .sheet{
    background:#fff;color:#111;font-family:'Inter',sans-serif;
    width:100%;max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .sheet .s-head{background:#161513;color:#fff;text-align:center;padding:18px 20px 14px;border-bottom:3px solid var(--gold)}
  .sheet .s-head .smono{width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Montserrat';font-weight:800;font-size:12px;margin-bottom:6px}
  .sheet .s-head h2{margin:0;font-family:'Montserrat';font-weight:800;font-size:22px;letter-spacing:3px}
  .sheet .s-head p{margin:3px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#cfc7b3}
  .sheet .s-body{padding:18px 22px 24px}
  .sheet .s-contact{text-align:center;font-size:10px;color:#444;border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:14px;line-height:1.6}
  .s-bar{background:#161513;color:#fff;font-family:'Montserrat';font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:5px;display:inline-block;margin:6px 0 10px}
  .s-field{display:flex;font-size:12.5px;border-bottom:1px dotted #bbb;padding:6px 0;gap:8px}
  .s-field .l{color:#666;font-weight:600;flex:0 0 38%}
  .s-field .v{flex:1;font-weight:500;color:#111}
  .s-row2{display:flex;gap:18px}
  .s-row2 .s-field{flex:1}
  .s-pkg{border:1px solid #ccc;border-left:5px solid var(--gold);border-radius:6px;padding:12px 14px;margin-top:6px}
  .s-pkg h4{margin:0 0 6px;font-family:'Montserrat';font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center}
  .s-pkg .pr{margin-left:auto;background:var(--cream);border:1px solid #e0d0a6;border-radius:14px;padding:2px 10px;font-size:12px}
  .s-pkg ul{margin:0;padding-left:16px}
  .s-pkg li{font-size:11px;color:#444;margin:2px 0}
  .s-totals{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
  .s-totals .t{flex:1;min-width:120px;border:1px solid #ddd;border-radius:6px;padding:10px 12px;text-align:center}
  .s-totals .t small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:3px}
  .s-totals .t b{font-family:'Montserrat';font-size:16px}
  .s-anti{margin-top:10px;font-size:11px}
  .s-anti table{width:100%;border-collapse:collapse}
  .s-anti td{border:1px solid #ddd;padding:5px 8px;font-size:11px}
  .s-sign{display:flex;gap:40px;margin-top:36px}
  .s-sign .sg{flex:1;text-align:center}
  .s-sign .sg .ln{border-top:1px solid #333;margin-top:34px;padding-top:6px;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px}
  .s-sign .sg .who{font-size:11px;font-weight:600;color:#111}
  .s-clauses{padding:22px}
  .s-clauses .ct{text-align:center;font-family:'Montserrat';font-weight:800;font-size:18px;letter-spacing:3px;margin:0 0 14px;border-bottom:2px solid #161513;padding-bottom:8px}
  .s-clauses ol{margin:0;padding-left:20px}
  .s-clauses li{font-size:10.5px;color:#333;margin-bottom:8px;line-height:1.45}
  .s-foot{text-align:center;font-size:10px;color:#555;font-style:italic;border-top:1px solid #161513;margin-top:14px;padding-top:10px}

  @media print{
    @page{size:letter;margin:12mm}
    body{background:#fff}
    .no-print{display:none !important}
    .shell{max-width:none;padding:0}
    .print-wrap{display:block !important}
    .sheet{border:none;border-radius:0;max-width:none}
    .sheet .s-head,.s-bar,.s-pkg,.s-totals .t b,.print-page2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .print-page2{page-break-before:always}
    .sheet,.print-page2{box-shadow:none}
  }

  /* ---------- Logo ---------- */
  .logo-img{height:40px;width:auto;display:block;flex:0 0 auto}
  @media(max-width:430px){.logo-img{height:33px}}
  .sheet .s-head .logo-sheet{height:82px;width:auto;display:inline-block;margin:0 auto 5px}

  /* ---------- Firma ---------- */
  .sigwrap{position:relative;border:1.5px dashed var(--line);border-radius:12px;background:#faf8f3;overflow:hidden}
  .sigpad{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair}
  .sighint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
  .sigconfirmed{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:center}
  .sigconfirmed img{max-height:120px;max-width:100%}
  .sheet .sigimg{max-height:62px;max-width:92%;display:block;margin:0 auto -4px}

  /* ---------- Calendario ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px}
  .cal-title{font-family:'Montserrat';font-weight:700;font-size:17px}
  .calnavbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;cursor:pointer;color:var(--ink);line-height:1}
  .calnavbtn:active{background:#f3efe6}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0;letter-spacing:.3px}
  .cal-cell{min-height:46px;border:1px solid var(--line);border-radius:9px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:#fff;transition:background .12s}
  .cal-cell.empty{border:none;background:transparent;cursor:default}
  .cal-cell .dnum{font-size:13px;font-weight:600;color:var(--ink)}
  .cal-cell.today{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
  .cal-cell.sel{background:var(--ink);border-color:var(--ink)}
  .cal-cell.sel .dnum{color:#fff}
  .cal-evdot{margin-top:auto;display:flex;gap:2.5px;padding-top:3px}
  .cal-evdot i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
  .cal-cell.sel .cal-evdot i{background:#fff}

  /* ---------- Fotos de sesión ---------- */
  .foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .foto-thumb{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#efeae1;border:1px solid var(--line);position:relative}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .upbar{height:8px;border-radius:5px;background:#efeae1;overflow:hidden;margin:8px 0}
  .upbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}

  /* ---------- Selección de fotos (cliente) ---------- */
  .btn:disabled{opacity:.5;pointer-events:none}
  .sesion-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c1b18,#2b2924);color:#fff;border:1px solid var(--gold);border-radius:14px;padding:16px;cursor:pointer;margin-bottom:18px}
  .sesion-banner .sb-ic{width:42px;height:42px;flex:0 0 auto;border-radius:10px;background:rgba(191,155,70,.2);display:flex;align-items:center;justify-content:center;color:var(--gold)}
  .sesion-banner .sb-ic svg{width:22px;height:22px}
  .sesion-banner .sb-t{font-family:'Montserrat';font-weight:800;font-size:14px;letter-spacing:.3px}
  .sesion-banner .sb-s{font-size:12.5px;color:#cfc8bb;margin-top:2px}
  .sesion-banner .chev{margin-left:auto;color:var(--gold)}
  .carwrap{position:relative;overflow:hidden;margin:0 -4px}
  .cartrack{display:flex;align-items:center;will-change:transform}
  .cslide{flex:0 0 auto;transform:scale(.84);opacity:.5;transition:transform .28s ease,opacity .28s ease;padding:0 4px;box-sizing:border-box}
  .cslide.on{transform:scale(1);opacity:1}
  .cs-img{position:relative;height:360px;border-radius:12px;overflow:hidden;background:#0c0b0a;border:2px solid transparent}
  .cslide.sel .cs-img{border-color:var(--gold)}
  .cs-img img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  .cs-badge{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1c1b18;display:none;align-items:center;justify-content:center;font-weight:800;font-size:15px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .cslide.sel .cs-badge{display:flex}
  .cs-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-family:'Montserrat';font-weight:800;font-size:15px;letter-spacing:1px;color:rgba(255,255,255,.34);white-space:nowrap;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.55);z-index:1}
  .cs-wm.big{font-size:22px}
  .carnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(28,27,24,.78);color:#fff;font-size:22px;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center}
  .carnav.prev{left:6px}
  .carnav.next{right:6px}
  .elegirbtn{width:auto;min-width:210px}
  .foto-modal{position:fixed;inset:0;background:rgba(8,7,6,.94);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
  .foto-modal-inner{position:relative;max-width:100%;max-height:100%}
  .foto-modal-inner img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:8px;user-select:none;-webkit-user-drag:none}
  .foto-modal-close{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:none;background:#fff;color:#1c1b18;font-size:18px;cursor:pointer;z-index:2}

  /* ---------- Agenda: grupos y etiqueta de tiempo ---------- */
  .listgroup{display:flex;align-items:center;gap:10px;margin:20px 0 10px;font-family:'Montserrat';font-weight:700;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:#6f6a5d}
  .listgroup .ln{flex:1;height:1px;background:var(--line)}
  .listgroup .ct{color:#b3ab9a;font-weight:600}
  .row .evchip{flex:0 0 auto;font-family:'Montserrat';font-weight:700;font-size:11px;padding:5px 9px;border-radius:999px;white-space:nowrap;line-height:1}
  .evchip.today{background:var(--ink);color:var(--gold)}
  .evchip.soon{background:#fbe7c2;color:#7a5a12}
  .evchip.future{background:#f1efe9;color:#6f6a5d}
  .evchip.past{background:#f3f1ec;color:#a8a092}
</style>
</head>

/* ---------- Almacenamiento de bajo nivel ---------- */
function safeParse(v){ try{ return JSON.parse(v); }catch(e){ return null; } }
const memFallback = {};
const hasStore = (typeof window!=='undefined' && window.storage && typeof window.storage.set==='function');
async function sSet(k,v){ if(hasStore){ try{ await window.storage.set(k,v,true); return; }catch(e){} } memFallback[k]=v; }
async function sGet(k){ if(hasStore){ try{ const r=await window.storage.get(k,true); return r?r.value:null; }catch(e){ return (k in memFallback)?memFallback[k]:null; } } return (k in memFallback)?memFallback[k]:null; }
async function sDel(k){ if(hasStore){ try{ await window.storage.delete(k,true); return; }catch(e){} } delete memFallback[k]; }
async function sList(p){ if(hasStore){ try{ const r=await window.storage.list(p,true); return r?r.keys:[]; }catch(e){} } return Object.keys(memFallback).filter(x=>x.startsWith(p)); }

/* ---------- Conexión con Google (Apps Script) ---------- */
async function apiPost(payload, opts){
  opts = opts || {};
  const tries = Math.max(1, opts.tries || 3);
  const timeout = opts.timeout || 15000;
  const sleep = (ms)=> new Promise(r=>setTimeout(r, ms));
  let lastErr;
  for(let i=0; i<tries; i++){
    let res;
    try{
      let signal, timer;
      if(typeof AbortController!=='undefined'){ const ctrl=new AbortController(); signal=ctrl.signal; timer=setTimeout(()=>{ try{ctrl.abort();}catch(e){} }, timeout); }
      try{ res = await fetch(BACKEND_URL, signal ? { method:'POST', body: JSON.stringify(payload), signal } : { method:'POST', body: JSON.stringify(payload) }); }
      finally { if(timer) clearTimeout(timer); }
    }catch(e){
      lastErr = new Error('conexion');
      if(i < tries-1){ await sleep(700*(i+1)); continue; }
      throw lastErr;
    }
    let data;
    try{ data = await res.json(); }
    catch(e){
      lastErr = new Error('respuesta');
      if(i < tries-1){ await sleep(700*(i+1)); continue; }
      throw lastErr;
    }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  throw lastErr || new Error('conexion');
}

/* ---------- Utilidades ---------- */
function genCode(){ const ch='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=ch[Math.floor(Math.random()*ch.length)]; return 'FG-'+s; }
function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('es-MX'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function abonado(c){ return (c.anticipos||[]).reduce((s,a)=>s+(Number(a.monto)||0),0); }
function saldo(c){ return (Number(c.costoTotal)||0)-abonado(c); }
function payTag(c){ const s=saldo(c); if((Number(c.costoTotal)||0)>0 && s<=0) return '<span class="tag green"><span class="dot"></span>Pagado</span>'; if(abonado(c)>0) return '<span class="tag amber"><span class="dot"></span>Con anticipo</span>'; return '<span class="tag gray"><span class="dot"></span>Sin pago</span>'; }
function fillTag(c){ return c.filled?'<span class="tag green"><span class="dot"></span>Llenado</span>':'<span class="tag amber"><span class="dot"></span>Pendiente</span>'; }
function fmtDate(d){ if(!d) return '—'; const p=String(d).split('-'); if(p.length===3) return p[2]+'/'+p[1]+'/'+p[0]; return d; }
function today(){ return new Date().toISOString().slice(0,10); }
function initials(n){ if(!n) return '?'; const w=n.trim().split(/\s+/); return ((w[0]||'')[0]||'').toUpperCase()+((w[1]||'')[0]||'').toUpperCase(); }

/* ---------- Almohadilla de firma (touch + mouse) ---------- */
function attachSignaturePad(canvasId){
  const c = document.getElementById(canvasId); if(!c) return;
  let ctx; try{ ctx = c.getContext('2d'); }catch(e){ ctx=null; } if(!ctx) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  if(rect.width){ c.width = Math.round(rect.width*ratio); c.height = Math.round((rect.height||180)*ratio); ctx.scale(ratio,ratio); }
  ctx.lineWidth = 2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#161513';
  let drawing=false, lastX=0, lastY=0;
  function pos(e){ const r=c.getBoundingClientRect(); const t=e.touches&&e.touches[0]; const cx=(t?t.clientX:e.clientX)-r.left; const cy=(t?t.clientY:e.clientY)-r.top; return [cx,cy]; }
  function start(e){ e.preventDefault(); drawing=true; const p=pos(e); lastX=p[0]; lastY=p[1]; }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p[0],p[1]); ctx.stroke(); lastX=p[0]; lastY=p[1]; c._drew=true; }
  function end(){ drawing=false; }
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
  c._drew=false;
}
function clearSignaturePad(canvasId){ const c=document.getElementById(canvasId); if(!c) return; try{ const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); }catch(e){} c._drew=false; }
function getSignatureData(canvasId){
  const c=document.getElementById(canvasId); if(!c||!c._drew) return null;
  try{
    const ctx=c.getContext('2d'); const w=c.width, h=c.height;
    const px=ctx.getImageData(0,0,w,h).data;
    let minX=w,minY=h,maxX=0,maxY=0,found=false;
    for(let y=0;y<h;y++){ const o=y*w; for(let x=0;x<w;x++){ if(px[(o+x)*4+3]>12){ found=true; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } } }
    if(!found) return null;
    const pad=10; minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad); maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
    const cw=Math.max(1,maxX-minX+1), ch=Math.max(1,maxY-minY+1);
    const maxW=400, scale=Math.min(1, maxW/cw);
    const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(cw*scale)); out.height=Math.max(1,Math.round(ch*scale));
    out.getContext('2d').drawImage(c, minX,minY,cw,ch, 0,0,out.width,out.height);
    return out.toDataURL('image/png');
  }catch(e){ try{ return c.toDataURL('image/png'); }catch(_){ return null; } }
}
function sigBlockHTML(key, existing){
  if(existing){
    return `<div id="sigbox_${key}">
      <div class="sigconfirmed"><img src="${existing}" alt="Firma"></div>
      <div style="text-align:center;margin-top:8px"><span class="tag green"><span class="dot"></span>Firma lista</span></div>
      <button type="button" class="btn btn-ghost btn-sm" data-sigredo="${key}" style="margin-top:10px;width:100%">Volver a firmar</button>
    </div>`;
  }
  return `<div id="sigbox_${key}">
    <div class="sigwrap"><canvas id="sigcanvas_${key}" class="sigpad"></canvas><div class="sighint">Firma con el dedo o el mouse</div></div>
    <div class="btn-row" style="margin-top:10px">
      <button type="button" class="btn btn-ghost btn-sm" data-sigclear="${key}">Restablecer</button>
      <button type="button" class="btn btn-primary btn-sm" data-sigok="${key}">Confirmar firma</button>
    </div>
  </div>`;
}
function wireSig(key, c){
  const box = document.getElementById('sigbox_'+key); if(!box) return;
  const canvas = document.getElementById('sigcanvas_'+key);
  if(canvas){
    attachSignaturePad('sigcanvas_'+key);
    const cl=box.querySelector('[data-sigclear]'); if(cl) cl.onclick=()=>clearSignaturePad('sigcanvas_'+key);
    const ok=box.querySelector('[data-sigok]'); if(ok) ok.onclick=()=>{ const d=getSignatureData('sigcanvas_'+key); if(!d){ toast('Primero dibuja tu firma'); return; } app['_sig_'+key]=d; box.outerHTML=sigBlockHTML(key,d); wireSig(key,c); toast('Firma confirmada ✓'); };
  } else {
    const re=box.querySelector('[data-sigredo]'); if(re) re.onclick=()=>{ app['_sig_'+key]=''; const b=document.getElementById('sigbox_'+key); b.outerHTML=sigBlockHTML(key,''); wireSig(key,c); };
  }
}
function currentSig(key){ const live=getSignatureData('sigcanvas_'+key); if(live) return live; return app['_sig_'+key]||''; }

async function saveContract(c){ if(useBackend){ const payload=Object.assign({}, c); delete payload.firmaPrestador; try{ await apiPost({action:'save', token:ADMIN_TOKEN, contract:payload}); }catch(e){ toast('No se pudo guardar. Revisa tu internet e intenta otra vez.'); throw e; } if(!S._byCode) S._byCode={}; S._byCode[c.code]=c; try{ const cl=LS.get('list')||[]; let found=false; for(let i=0;i<cl.length;i++){ if(cl[i] && cl[i].code===c.code){ cl[i]=c; found=true; break; } } if(!found) cl.push(c); LS.set('list', cl); }catch(e){} return; } await sSet('contract:'+c.code, JSON.stringify(c)); }
async function getContract(code){ if(useBackend){ try{ const r=await apiPost({action:'get', code:code}); return r.contract||null; }catch(e){ toast('Error al conectar con Google Drive'); return null; } } const v=await sGet('contract:'+code); return v?safeParse(v):null; }

async function deleteContract(code){ if(useBackend){ try{ await apiPost({action:'delete', token:ADMIN_TOKEN, code:code}); }catch(e){ toast('No se pudo eliminar'); } return; } await sDel('contract:'+code); }

function paintDashboard(list){
  S._byCode = {}; list.forEach(function(c){ if(c && c.code) S._byCode[c.code]=c; });
  const today0 = (()=>{ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
  const parseDay = (s)=>{ if(!s) return null; const p=String(s).split('-'); if(p.length<3) return null; const dd=new Date(+p[0], +p[1]-1, +p[2]); return isNaN(dd.getTime())?null:dd; };
  const diffDays = (s)=>{ const dd=parseDay(s); if(!dd) return null; return Math.round((dd - today0)/86400000); };
  const relDays = (d)=>{ if(d===0) return 'Hoy'; if(d===1) return 'Mañana'; if(d===-1) return 'Ayer'; const a=Math.abs(d); let t; if(a<14) t=a+' días'; else if(a<60) t=Math.round(a/7)+' semanas'; else if(a<365) t=Math.round(a/30)+' meses'; else { const y=Math.round(a/365); t=y+(y===1?' año':' años'); } return d>0 ? ('En '+t) : ('Hace '+t); };

  const prox=[], pasado=[], sinFecha=[]; let entregados=0;
  list.forEach(c=>{ if(c.entregado){ entregados++; return; } const d=diffDays(c.fechaEvento); if(d===null) sinFecha.push(c); else if(d>=0) prox.push([d,c]); else pasado.push([d,c]); });
  prox.sort((a,b)=>a[0]-b[0]);
  pasado.sort((a,b)=>b[0]-a[0]);
  sinFecha.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const rowHTML = (c, d)=>{
    const nm = c.filled && c.nombreContratante ? c.nombreContratante : 'Contrato sin llenar';
    const ev = [c.tipoEvento, c.fechaEvento?('· '+fmtDate(c.fechaEvento)):''].filter(Boolean).join(' ');
    let chip='';
    if(d!==null){ const cls = d===0?'today':(d>0?(d<=7?'soon':'future'):'past'); chip=`<div class="evchip ${cls}">${relDays(d)}</div>`; }
    return `
      <button class="row" data-act="open" data-code="${esc(c.code)}">
        <div class="avatar">${esc(c.filled?initials(c.nombreContratante):'FG')}</div>
        <div class="meta">
          <div class="name">${esc(nm)}</div>
          <div class="line">${esc(c.code)} ${ev?('· '+esc(ev)):''}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${fillTag(c)} ${payTag(c)}</div>
        </div>
        ${chip}
        <div class="chev">${IC.chevron}</div>
      </button>`;
  };
  const groupHTML = (label, arr, dated)=> arr.length ? (`<div class="listgroup"><span>${label}</span><span class="ln"></span><span class="ct">${arr.length}</span></div>` + arr.map(x=> dated ? rowHTML(x[1], x[0]) : rowHTML(x, null)).join('')) : '';

  const body = (prox.length || pasado.length || sinFecha.length)
    ? (groupHTML('Próximos eventos', prox, true) + groupHTML('Ya realizados', pasado, true) + groupHTML('Sin fecha de evento', sinFecha, false))
    : `<div class="card"><div class="empty">${IC.folder}<div style="font-weight:600;color:#3a382f;margin-bottom:4px">Aún no hay contratos</div><div>Crea el primero y comparte el código con tu cliente.</div></div></div>`;

  app.innerHTML = `
    <div class="eyebrow">Administrador</div>
    <h2 class="page">Mis contratos</h2>
    <p class="sub">${(prox.length+pasado.length+sinFecha.length)} ${(prox.length+pasado.length+sinFecha.length)===1?'contrato activo':'contratos activos'} · ${useBackend?'Google Drive conectado':'guardado local'}</p>
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn btn-gold" data-act="goCreate">${IC.plus} Crear contrato</button>
      ${entregados?`<button class="btn btn-ghost" data-act="goHistorial">${IC.check} Historial (${entregados})</button>`:''}
    </div>
    <div style="text-align:right;margin-bottom:16px"><button class="btn btn-ghost btn-sm" data-act="lock" style="width:auto;display:inline-flex;align-items:center;gap:6px">${IC.lock} Bloquear</button></div>
    ${body}
  `;
  bind();
}

function ymd(d){ const m=d.getMonth()+1, day=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day; }
function calDates(c){
  const f = (c && typeof c==='object') ? c.fechaEvento : c;
  if(!f) return null;
  const p=String(f).split('-'); if(p.length<3) return null;
  const ev=new Date(+p[0],+p[1]-1,+p[2]); if(isNaN(ev.getTime())) return null;
  const mo=ev.getMonth(); const days=(mo===11||mo===0)?75:45;
  const pd=s=>{ const q=String(s).split('-'); return new Date(+q[0],+q[1]-1,+q[2]); };
  const oEnt = (c && typeof c==='object') ? c.fechaEntrega : '';
  const oTra = (c && typeof c==='object') ? c.fechaTrabajo : '';
  const entrega = oEnt ? pd(oEnt) : (()=>{ const x=new Date(ev.getTime()); x.setDate(x.getDate()+days); return x; })();
  const trabajo = oTra ? pd(oTra) : (()=>{ const x=new Date(entrega.getTime()); x.setDate(x.getDate()-14); return x; })();
  return {evento:ev, entrega:entrega, trabajo:trabajo, days:days, entregaManual:!!oEnt, trabajoManual:!!oTra};
}
function fmtCal(d){ return d.toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); }

async function doSaveFechas(){
  const c = await getContract(S.code); if(!c) return;
  const evento = (document.getElementById('fEvento').value||'');

  const trabajoIn = (document.getElementById('fTrabajo').value||'');
  if(!evento){ toast('Pon la fecha del evento'); return; }
  c.fechaEvento = evento;
  const auto = calDates({fechaEvento:evento});
  c.fechaEntrega = (entregaIn && entregaIn !== ymd(auto.entrega)) ? entregaIn : '';
  const auto2 = calDates({fechaEvento:evento, fechaEntrega:c.fechaEntrega});
  c.fechaTrabajo = (trabajoIn && trabajoIn !== ymd(auto2.trabajo)) ? trabajoIn : '';
  toast('Guardando…');
  try{ await saveContract(c); }catch(e){ toast('No se pudo guardar'); return; }
  try{ if(c.fechaEvento) await apiPost({action:'agendar', token:ADMIN_TOKEN, code:c.code}); }catch(e){}
  go('detail', c.code); toast('Fechas actualizadas ✓');
}

/* Al abrir el panel, revisa TODOS los contratos y agenda/actualiza en segundo plano (sin duplicar) */
function maybeSyncCalendar(){
  if(!useBackend) return;
  const now = Date.now();
  if(S._lastCalSync && (now - S._lastCalSync) < 120000) return;   // máx 1 vez cada 2 min
  S._lastCalSync = now;
  apiPost({action:'agendarTodos', token:ADMIN_TOKEN}, {tries:1}).then(function(r){
    const n = r ? ((r.added||0)+(r.updated||0)) : 0;
    if(n>0){ toast('Agenda actualizada: '+n+' evento(s) en tu calendario'); }
  }).catch(function(){});
}

async function viewCalendar(){
  let all = S._calContracts;
  if(!all){ all = await listContracts(); S._calContracts = all; }
  const byDate = {};
  for(const c of all){ if(c.fechaEvento){ (byDate[c.fechaEvento] = byDate[c.fechaEvento]||[]).push(c); } }
  const now = new Date();
  if(S.calY==null){ S.calY=now.getFullYear(); S.calM=now.getMonth(); }
  const y=S.calY, m=S.calM;
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const pad2=n=>String(n).padStart(2,'0');
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
  const dow=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  let cells='';
  for(let i=0;i<startOffset;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds=y+'-'+pad2(m+1)+'-'+pad2(d);
    const evs=byDate[ds]||[];
    let cls='cal-cell'; if(ds===todayStr) cls+=' today'; if(ds===S.calSel) cls+=' sel';
    const dots = evs.length? `<div class="cal-evdot">${evs.slice(0,3).map(()=>'<i></i>').join('')}</div>`:'';
    cells+=`<div class="${cls}" data-act="calDay" data-day="${ds}"><div class="dnum">${d}</div>${dots}</div>`;
  }
  let listHTML='';
  if(S.calSel){
    if(byDate[S.calSel]) listHTML = eventListHTML(byDate[S.calSel], S.calSel);
    else listHTML = `<div class="sectionline"><span>${fmtDate(S.calSel)}</span></div><div class="card"><div class="empty" style="padding:22px">Sin eventos este día.</div></div>`;
  }
  const monthPrefix=y+'-'+pad2(m+1);
  const monthEvents=Object.keys(byDate).filter(k=>k.indexOf(monthPrefix)===0).reduce((s,k)=>s+byDate[k].length,0);
  app.innerHTML = `
    <div class="eyebrow">Calendario</div>
    <h2 class="page">Agenda de eventos</h2>
    <p class="sub">${monthEvents} ${monthEvents===1?'evento':'eventos'} en ${meses[m]}</p>
    <div class="cal-head">
      <button class="calnavbtn" data-act="calPrev" aria-label="Mes anterior">‹</button>
      <div class="cal-title">${meses[m]} ${y}</div>
      <button class="calnavbtn" data-act="calNext" aria-label="Mes siguiente">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="text-align:center;margin:14px 0 4px"><button class="btn btn-ghost btn-sm" data-act="calToday" style="width:auto">Ir a hoy</button></div>
    ${listHTML}
  `;
  bind();
}

function setUploadProgress(done, total, msg){
  const s=document.getElementById('upStatus'); if(s) s.textContent = (msg!=null) ? msg : (total? ('Subiendo '+done+' de '+total+'…') : '');
  const bar=document.getElementById('upBar'); if(bar) bar.style.width = total? (Math.round(done/total*100)+'%') : '0%';
}
function downscaleImage(file, maxDim, quality){
  return new Promise(function(resolve,reject){
    const img=new Image();
    img.onload=function(){
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      let url; try{ url=cv.toDataURL('image/jpeg', quality); }catch(e){ reject(e); return; }
      resolve(url.split(',')[1]);
    };
    img.onerror=function(){ reject(new Error('img')); };
    const fr=new FileReader(); fr.onload=function(){ img.src=fr.result; }; fr.onerror=function(){ reject(new Error('read')); }; fr.readAsDataURL(file);
  });
}

async function copyText(txt){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}

function fileToB64(file){
  return new Promise(function(resolve,reject){
    const fr=new FileReader();
    fr.onload=function(){ const s=fr.result; const i=s.indexOf(','); resolve(i>=0? s.substring(i+1) : s); };
    fr.onerror=function(){ reject(new Error('read')); };
    fr.readAsDataURL(file);
  });
}

    case 'share': go('share', code); break;
    case 'shareBack': go('detail', S.code); break;
    case 'copyShare': { const t=document.getElementById('shareMsg'); try{ await navigator.clipboard.writeText(t.value); }catch(e){ try{ t.select(); document.execCommand('copy'); }catch(_){} } toast('Mensaje copiado ✓'); break; }
    case 'waShare': { const t=document.getElementById('shareMsg'); window.open('https://wa.me/?text='+encodeURIComponent(t.value),'_blank'); break; }
    case 'goFotos': go('fotos', code); break;
    case 'goEvento': go('evento', code); break;
    case 'evQ': { app._evQuality=el.getAttribute('data-q'); document.querySelectorAll('[data-act="evQ"]').forEach(function(bt){ const on=(bt.getAttribute('data-q')===app._evQuality); bt.className='btn btn-sm '+(on?'btn-gold':'btn-ghost'); }); break; }
    case 'evCrearCarpeta': { const nombre=window.prompt('Nombre de la carpeta (ej. Ceremonia, Recepción):',''); if(nombre && nombre.trim()){ toast('Creando…'); try{ await apiPost({action:'evento_crearcarpeta', token:ADMIN_TOKEN, code:S.code, nombre:nombre.trim()}); }catch(e){ toast('No se pudo crear'); break; } go('evento', S.code); toast('Carpeta creada ✓'); } break; }
    case 'evSubir': { app._evSub = el.getAttribute('data-sub'); const inp=document.getElementById('evInput'); if(inp){ inp.value=''; inp.click(); } break; }
    case 'evBorrarCarpeta': { const sub=el.getAttribute('data-sub'), nm=el.getAttribute('data-name'); if(window.confirm('¿Eliminar la carpeta "'+nm+'" y todas sus fotos?')){ toast('Eliminando…'); try{ await apiPost({action:'evento_borrarcarpeta', token:ADMIN_TOKEN, code:S.code, subId:sub}); }catch(e){ toast('No se pudo'); break; } go('evento', S.code); toast('Carpeta eliminada'); } break; }
    case 'evSetLimit': { const lim=Number(document.getElementById('printLimit').value)||0; try{ await apiPost({action:'evento_setlimit', token:ADMIN_TOKEN, code:S.code, limit:lim}); }catch(e){ toast('No se pudo guardar'); break; } toast(lim? ('Límite guardado: '+lim+' fotos') : 'Guardado: sin límite'); break; }
    case 'evPararImprimir': { toast('Preparando…'); try{ const r=await apiPost({action:'evento_pararimprimir', token:ADMIN_TOKEN, code:S.code}); if(r&&r.folderUrl){ window.open(r.folderUrl,'_blank'); toast('Listo: '+(r.count||0)+' foto(s) juntas'); } else { toast('No se pudo preparar'); } }catch(e){ toast('No se pudo preparar'); } break; }
    case 'agendarCal': await doAgendar(); break;
    case 'desagendarCal': await doDesagendar(); break;
    case 'goEditFechas': go('editFechas', code); break;
    case 'saveFechas': await doSaveFechas(); break;
    case 'editPkg': go('editPkg', code); break;
    case 'savePkg': await doSavePkg(); break;
    case 'pkgBack': go('detail', S.code); break;
    case 'goSeleccion': go('seleccion', code); break;
    case 'selBack': go('detail', S.code); break;
    case 'copySelNames': { const s=S._selNames; if(!s){ toast('Nada que copiar'); break; } const txt='SELECCIÓN DEL CLIENTE\n\nFOTO GRANDE (ampliación): '+s.big+'\n\n20 FOTOS ELEGIDAS:\n'+s.list.map((n,i)=>(i+1)+'. '+n).join('\n'); const okc=await copyText(txt); if(okc){ toast('Lista copiada ✓'); } else { window.prompt('Copia la lista de nombres:', txt); } break; }
    case 'pickFotos': { const inp=document.getElementById('fotoInput'); if(inp) inp.click(); break; }
    case 'fotosBack': go('detail', S.code); break;
    case 'print': go('print', code); break;
    case 'doPrint': window.print(); break;
    case 'closePrint': document.getElementById('printArea').innerHTML=''; go('detail', S.code); break;
    case 'del': { if(confirm('¿Eliminar este contrato? Esta acción no se puede deshacer.')){ await deleteContract(code); go('dashboard'); toast('Contrato eliminado'); } break; }
    case 'goHistorial': go('historial'); break;
    case 'histBack': go('dashboard'); break;
    case 'entregar': { if(confirm('¿Marcar como ENTREGADO?\n\nEl contrato se guardará en tu historial y desaparecerá de la lista. El cliente ya no verá su contrato: solo el mensaje de agradecimiento.')){ const c=await getContract(S.code); if(!c) break; c.entregado=true; c.entregadoAt=Date.now(); try{ await saveContract(c); }catch(e){ break; } go('dashboard'); toast('Pedido entregado ✓'); } break; }
    case 'reactivar': { const c=await getContract(S.code); if(!c) break; c.entregado=false; c.entregadoAt=0; try{ await saveContract(c); }catch(e){ break; } go('detail', S.code); toast('Contrato reactivado'); break; }
  }
}

backBtn.addEventListener('click',()=>go('dashboard'));
S.view='ownerGate';
render();

</script>
